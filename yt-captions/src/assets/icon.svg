<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- YouTube logo (1:1 square, centered upper area) -->
  <rect x="14" y="12" width="100" height="100" rx="22" fill="#FF4444"/>

  <!-- Play triangle -->
  <path d="M48 32 L48 92 L92 62 Z" fill="#FFFFFF"/>

  <!-- Caption bar (extends beyond logo) -->
  <rect x="24" y="100" width="84" height="26" rx="7" fill="rgba(0,0,0,0.2)"/>

  <!-- Beamed eighth notes (left side) -->
  <g fill="#FFFFFF" transform="translate(30, 106)">
    <ellipse cx="3.5" cy="14" rx="4" ry="2.8" transform="rotate(-25 3.5 14)"/>
    <path d="M7 12.8 L7 1.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="16" cy="11.5" rx="4" ry="2.8" transform="rotate(-25 16 11.5)"/>
    <path d="M19.5 10.3 L19.5 0" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M6.5 2.5 L20 0.8 L20 -1.2 L6.5 0.5 Z" fill="#FFFFFF"/>
  </g>

  <!-- Caption text lines (right side) -->
  <rect x="56" y="106" width="24" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="84" y="106" width="18" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="56" y="116" width="16" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="76" y="116" width="26" height="4" rx="2" fill="#FFFFFF"/>
</svg>
